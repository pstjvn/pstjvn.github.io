<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЕС Райко Жинзифов № 43</title>
    <style>
        :root {
            color-scheme: light dark;
            --primary-bg: light-dark(#fff, #000);
            --primary-cl: light-dark(#000, #fff);
            --no-debt-bg: light-dark(#e2e5d9, #72865c);
            --debt-bg: light-dark(#c68289, #633140);
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100lvh;
            background-color: var(--primary-bg);
            color: var(--primary-cl);
        }

        main {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            row-gap: 1rem;
            column-gap: 1rem;
            padding: 1rem;
        }

        .appartment {
            border-radius: 20px;
            padding: 12px;
            font-size: 1.18rem;
            background-color: #dce1de;
            text-align: center;
            /* display: flex; */
            justify-content: center;
            align-items: center;
            background-color: var(--no-debt-bg);

            &.debt {
                background-color: var(--debt-bg);
            }

            &>.debt {
                display: none;
            }

            &.debt>.debt {
                display: block;
            }
        }
    </style>
</head>

<body>
    <template id="appartment">
        <div class="appartment">
            <div class="number">Апартамент №: <span></span></div>
            <div class="inhabitants">Живущи: <span></span></div>
            <div class="dogs">Кучета: <span></span></div>
            <div class="debt">Дължи: <span></span></div>
        </div>
    </template>
    <h1>ЕС Райко Жинзифов № 43</h1>
    <main>
        <h3>Зарежда се...</h3>
    </main>
    <script type="module" src="script.js"></script>
</body>

</html>
