<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЕС Райко Жинзифов № 43</title>
    <style>
        :root {
            color-scheme: light dark;
            --primary-bg: light-dark(#fff, #000);
            --primary-cl: light-dark(#000, #fff);
            --no-debt-bg: light-dark(#e2e5d9, #72865c);
            --debt-bg: light-dark(#c68289, #633140);
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100lvh;
            background-color: var(--primary-bg);
            color: var(--primary-cl);
        }

        main {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            row-gap: 1rem;
            column-gap: 1rem;
            padding: 1rem;
        }

        .appartment {
            border-radius: 20px;
            padding: 12px;
            font-size: 1.18rem;
            background-color: #dce1de;
            text-align: center;
            /* display: flex; */
            justify-content: center;
            align-items: center;
            background-color: var(--no-debt-bg);

            &.debt {
                background-color: var(--debt-bg);
            }

            &>.debt {
                display: none;
            }

            &.debt>.debt {
                display: block;
            }
        }
    </style>
</head>

<body>
    <template id="appartment">
        <div class="appartment">
            <div class="number">Апартамент №: <span></span></div>
            <div class="inhabitants">Живущи: <span></span></div>
            <div class="dogs">Кучета: <span></span></div>
            <div class="debt">Дължи: <span></span></div>
        </div>
    </template>
    <h1>ЕС Райко Жинзифов № 43</h1>
    <main>
        <h3>Зарежда се...</h3>
    </main>
    <script>
        (async function () {
            /** 
             * @typedef OneTimeTax 
             * @type {object}
             * @property {number}entrance
             * @property {number} common
             */

            /**
             * @typedef Taxes 
             * @type {object}
             * @property {number} entrance
             * @property {number} common
             * @property {number} people
             * @property {OneTimeTax} onceTime
             */

            /**
             * @typedef AppartmentRecord 
             * @type {object}
             * @property {number} appNumber 
             * @property {number} people
             * @property {number} dogs
             * @property {number} due
             * @property {Taxes} taxes
             */

            /**
             * @typedef ServerResponse 
             * @type {object}
             * @property {Array<AppartmentRecord>} data
             */

            let formatter = new Intl.NumberFormat('bg-BG', { style: 'currency', currency: 'EUR' })
            let currencyFormatter = Intl.NumberFormat('bg', {
                style: 'currency',
                currency: 'BGN',
                minimumFractionDigits: 2
            });

            function formatCurrency(value) { return currencyFormatter.format(value); }

            function setContent(div, text) {
                div.querySelector('span').textContent = text;
            }

            let url = 'https://script.google.com/macros/s/AKfycbwoC77zW-80QlC0oEKDPAqJY6_yg3j9k2hGE-eiB7MLGPtPmVdPczMEYCo7Ys3mCCpQUw/exec'
            let res = await fetch(url, { mode: "cors" });
            /** @type {ServerResponse} */
            let data = await res.json();
            console.log(data);
            let fragment = document.createDocumentFragment();
            let tpl = document.getElementById('appartment');
            for (let i = 0; i < data.data.length; i++) {
                let r = data.data[i];
                let el = tpl.content.cloneNode(true);
                let app = el.querySelector('div');
                let nodes = app.querySelectorAll('div');
                nodes.forEach(function (el, index) {
                    switch (index) {
                        case 0:
                            setContent(el, r.appNumber);
                            break;
                        case 1:
                            setContent(el, r.people);
                            break;
                        case 2:
                            setContent(el, r.dogs);
                            break;
                        case 3:
                            let amount = r.due;
                            if (amount < 0) {
                                app.classList.add('debt');
                                setContent(el, formatter.format(amount * -1));
                            }
                            break;
                    }
                });
                fragment.appendChild(el);
            }
            document.querySelector('main').querySelector('h3').remove();
            document.querySelector('main').appendChild(fragment);
        })();
    </script>
</body>

</html>
